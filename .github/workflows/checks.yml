name: Build and examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: glow-los
      - run: python -m pip install -e '.[examples,dev]'
      - run: glow-los-build
      - run: python -m pytest tests -q
      - run: python examples/glow_los_disk_spectra.py --oza 45 --no-show
      - run: python examples/glow_los_limb_spectra.py --tan-km 150 --no-show
