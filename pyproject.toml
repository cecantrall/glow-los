[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glow-los"
version = "0.1.0"
description = "Core GLOW, REDISTER, and line-of-sight airglow forward model"
readme = "README.md"
requires-python = ">=3.9, <4"
license = { text = "BSD-2-Clause for wrapper code; bundled GLOW has separate academic research terms (see docs/glow.md)" }
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.11",
    "netCDF4>=1.7.2",
    "pymsis>=0.10.0",
    "iricore>=1.9.0",
    "meson>=1.8.2",
    "ninja>=1.11.1.4",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
glow-los-build = "glow_los.build:main"

[tool.hatch.build]
exclude = [
    "**/*.so", "**/*.dylib", "**/*.o", "**/*.mod", "**/*.dSYM/**",
    "**/__pycache__/**", "**/build/**", "**/a.out", "**/fort.*",
    "**/redister.sor", "**/redister.str", "**/examples/output/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glow_los"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/glow_los",
    "/README.md",
    "/LICENSE",
    "/examples",
    "/tests",
    "/docs",
    "/environment.yml",
]
